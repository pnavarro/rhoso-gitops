---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: rhoso-gitops application template
templates:
  - application.yaml
tests:
  # Helm merges values; we cannot replace the whole applications map from tests.
  # Assert on one real Application from values.yaml via documentSelector.
  - it: renders openstack-controlplane Application from default values
    values:
      - ../values.yaml
    set:
      global:
        namespace: rhoso-gitops-standalone
    documentSelector:
      path: metadata.name
      value: openstack-controlplane
    asserts:
      - isKind:
          of: Application
      - equal:
          path: apiVersion
          value: argoproj.io/v1alpha1
      - equal:
          path: metadata.name
          value: openstack-controlplane
      - equal:
          path: metadata.namespace
          value: rhoso-gitops-standalone
      - equal:
          path: metadata.finalizers[0]
          value: resources-finalizer.argocd.argoproj.io/foreground
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: spec.project
          value: default
      - equal:
          path: spec.source.repoURL
          value: https://github.com/openstack-k8s-operators/gitops
      - equal:
          path: spec.source.path
          value: example/openstack-controlplane
      - equal:
          path: spec.source.targetRevision
          value: v0.3.4
      - equal:
          path: spec.destination.server
          value: https://kubernetes.default.svc
      - equal:
          path: spec.syncPolicy.syncOptions[0]
          value: Prune=true
      - exists:
          path: spec.syncPolicy.automated
      - equal:
          path: spec.syncPolicy.retry.limit
          value: 5
      - equal:
          path: spec.syncPolicy.retry.backoff.duration
          value: 30s
      - equal:
          path: spec.syncPolicy.retry.backoff.factor
          value: 2
      - equal:
          path: spec.syncPolicy.retry.backoff.maxDuration
          value: 3m

  - it: renders operator-dependencies with default background finalizer
    values:
      - ../values.yaml
    documentSelector:
      path: metadata.name
      value: operator-dependencies
    asserts:
      - equal:
          path: metadata.finalizers[0]
          value: resources-finalizer.argocd.argoproj.io/background

  - it: allows disabling automated sync via syncPolicy override
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        manual-test:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: v1.0.0
          syncPolicy:
            syncOptions:
              - Prune=true
    documentSelector:
      path: metadata.name
      value: manual-test
    asserts:
      - notExists:
          path: spec.syncPolicy.automated
      - equal:
          path: spec.syncPolicy.syncOptions[0]
          value: Prune=true

  - it: defaults syncWave to 0 when omitted
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        no-wave:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
          syncPolicy:
            syncOptions:
              - Prune=true
    documentSelector:
      path: metadata.name
      value: no-wave
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"

  - it: uses explicit syncWave when set
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        late-app:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
          syncWave: "10"
          syncPolicy:
            syncOptions:
              - Prune=true
    documentSelector:
      path: metadata.name
      value: late-app
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "10"

  - it: omits spec.source.kustomize when not set in values
    values:
      - ../values.yaml
    documentSelector:
      path: metadata.name
      value: operator-dependencies
    asserts:
      - notExists:
          path: spec.source.kustomize

  - it: renders spec.source.kustomize when applications entry sets kustomize
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        kustom-test:
          enabled: true
          repoURL: https://github.com/example/repo
          path: examples/foo
          targetRevision: main
          syncPolicy:
            syncOptions:
              - Prune=true
          kustomize:
            namePrefix: dev-
            components:
              - https://github.com/example/components/overlay
    documentSelector:
      path: metadata.name
      value: kustom-test
    asserts:
      - equal:
          path: spec.source.kustomize.namePrefix
          value: dev-
      - equal:
          path: spec.source.kustomize.components[0]
          value: https://github.com/example/components/overlay

  - it: fails values schema when repoURL is missing
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        bad:
          enabled: true
          path: "."
          targetRevision: main
    asserts:
      - failedTemplate:
          errorPattern: repoURL

  - it: fails values schema when destinationServer is not an https URI
    set:
      destinationServer: http://insecure.example
      applications:
        a:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
    asserts:
      - failedTemplate:
          errorPattern: destinationServer

  - it: omits spec.ignoreDifferences when not set in values
    values:
      - ../values.yaml
    documentSelector:
      path: metadata.name
      value: operator-dependencies
    asserts:
      - notExists:
          path: spec.ignoreDifferences

  - it: renders spec.ignoreDifferences when set
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        ignore-diff-test:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
          syncPolicy:
            syncOptions:
              - RespectIgnoreDifferences=true
          ignoreDifferences:
            - group: core.openstack.org
              kind: OpenStackControlPlane
              jsonPointers:
                - /spec/tls
                - /spec/watcher
    documentSelector:
      path: metadata.name
      value: ignore-diff-test
    asserts:
      - equal:
          path: spec.ignoreDifferences[0].group
          value: core.openstack.org
      - equal:
          path: spec.ignoreDifferences[0].kind
          value: OpenStackControlPlane
      - equal:
          path: spec.ignoreDifferences[0].jsonPointers[0]
          value: /spec/tls

  - it: renders spec.ignoreDifferences with jqPathExpressions
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        jq-diff-test:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
          ignoreDifferences:
            - group: dataplane.openstack.org
              kind: OpenStackDataPlaneNodeSet
              jqPathExpressions:
                - '.spec.preProvisioned | select(. == false or . == "false")'
    documentSelector:
      path: metadata.name
      value: jq-diff-test
    asserts:
      - equal:
          path: spec.ignoreDifferences[0].jqPathExpressions[0]
          value: '.spec.preProvisioned | select(. == false or . == "false")'

  - it: fails values schema when finalizer is not allowed
    set:
      destinationServer: https://kubernetes.default.svc
      applications:
        bad:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
          finalizers:
            - resources-finalizer.argocd.argoproj.io/invalid
    asserts:
      - failedTemplate:
          errorPattern: finalizers

  - it: uses global.namespace for Application metadata.namespace when set
    set:
      global:
        namespace: rhoso-gitops-standalone
      destinationServer: https://kubernetes.default.svc
      applications:
        ns-test:
          enabled: true
          repoURL: https://github.com/example/repo
          path: "."
          targetRevision: main
    documentSelector:
      path: metadata.name
      value: ns-test
    asserts:
      - equal:
          path: metadata.namespace
          value: rhoso-gitops-standalone
