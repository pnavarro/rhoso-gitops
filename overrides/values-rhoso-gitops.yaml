---
# User-managed overrides for charts/all/rhoso-gitops.
# Add only the keys you need to change from chart defaults
# (charts/all/rhoso-gitops/values.yaml). Unspecified keys inherit
# the chart defaults automatically.
# See charts/all/rhoso-gitops/README.md for available keys and examples.
  operator-dependencies:
    enabled: true
    repoURL: https://github.com/openstack-k8s-operators/gitops
    path: example/dependencies
    targetRevision: v0.3.1
    kustomize:
      components:
        - "https://github.com/openstack-k8s-operators/gitops/components/argocd/hooks/postDelete/deploy-operators?ref=v0.3.1"
        - "https://github.com/openstack-k8s-operators/gitops/components/dependencies/provisioning-config?ref=v0.3.1"
        - "https://github.com/openstack-k8s-operators/gitops/components/argocd/annotations?ref=v0.3.1"
    syncPolicy:
      automated: {}
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 3m
      syncOptions:
        - Prune=true
        - SkipDryRunOnMissingResource=true
  openstack-operator:
    enabled: true
  repoURL: https://github.com/openstack-k8s-operators/gitops
    path: example/openstack-operator
    targetRevision: v0.3.1
    syncPolicy:
      automated: {}
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 3m
      syncOptions:
        - Prune=true
      patches:
        - target:
            kind: OperatorGroup
            name: openstack
          patch: |-
            apiVersion: operators.coreos.com/v1
            kind: OperatorGroup
            metadata:
              name: openstack
            $patch: delete
        - target:
            kind: Namespace
            name: openstack
          patch: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: openstack
            $patch: delete
        - target:
            kind: Namespace
            name: openstack-operators
          patch: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: openstack-operators
            $patch: delete
        - target:
            kind: Job
            name: approve-openstack-installplan
          patch: |-
            [
              {"op": "replace", "path": "/metadata/namespace", "value": "rhoso-gitops-standalone"},
              {"op": "replace", "path": "/spec/template/spec/serviceAccountName", "value": "standalone-gitops-argocd-application-controller"}
            ]
        - target:
            kind: ClusterRoleBinding
            name: installplan-approver-binding
          patch: |-
            [
              {"op": "replace", "path": "/subjects/0/name", "value": "standalone-gitops-argocd-application-controller"},
              {"op": "replace", "path": "/subjects/0/namespace", "value": "rhoso-gitops-standalone"}
  openstack-operator-cr:
    enabled: true
    repoURL: https://github.com/openstack-k8s-operators/gitops
    path: example/openstack-operator-cr
    targetRevision: v0.3.1
    syncPolicy:
      automated: {}
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 3m
      syncOptions:
        - Prune=true
  openstack-controlplane:
    enabled: true
    repoURL: https://github.com/pnavarro/osp-on-ocp-showroom
    path: gitops/environments/demo-env/controlplane
    targetRevision: main
    finalizers:
      - resources-finalizer.argocd.argoproj.io/foreground
    syncPolicy:
      automated: {}
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 3m
      syncOptions:
        - Prune=true
  openstack-secrets:
    enabled: false
  openstack-dataplane:
    enabled: true
    repoURL: https://github.com/pnavarro/osp-on-ocp-showroom
    path: gitops/environments/demo-env/dataplane
    targetRevision: main
    syncPolicy:
      automated: {}
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 3m
      syncOptions:
        - Prune=true
  openstack-networks:
    enabled: true
    repoURL: https://github.com/pnavarro/osp-on-ocp-showroom
    path: gitops/environments/demo-env/networks
    targetRevision: main
    syncPolicy:
      automated: {}
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 3m
      syncOptions:
        - Prune=true  
