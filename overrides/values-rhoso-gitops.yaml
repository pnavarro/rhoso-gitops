applications:
  operator-dependencies:
    repoURL: https://github.com/openstack-k8s-operators/gitops
    path: example/dependencies
    targetRevision: v0.3.4
    kustomize:
      components:
        - "https://github.com/openstack-k8s-operators/gitops/components/argocd/hooks/postDelete/deploy-operators?ref=v0.3.4"
        - "https://github.com/openstack-k8s-operators/gitops/components/dependencies/provisioning-config?ref=v0.3.4"
        - "https://github.com/openstack-k8s-operators/gitops/components/argocd/annotations?ref=v0.3.4"
      patches:
        - target:
            kind: Job
            name: clean-observability
          patch: |-
            [
              {"op": "replace", "path": "/metadata/namespace", "value": "openshift-gitops"},
              {"op": "replace", "path": "/spec/template/spec/serviceAccountName", "value": "openshift-gitops-argocd-application-controller"}
            ]
  openstack-operator:
    repoURL: https://github.com/openstack-k8s-operators/gitops
    path: example/openstack-operator
    targetRevision: v0.3.4
    kustomize:
      patches:
        - target:
            kind: OperatorGroup
            name: openstack
          patch: |-
            apiVersion: operators.coreos.com/v1
            kind: OperatorGroup
            metadata:
              name: openstack
            $patch: delete
        - target:
            kind: Namespace
            name: openstack
          patch: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: openstack
            $patch: delete
        - target:
            kind: Namespace
            name: openstack-operators
          patch: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: openstack-operators
            $patch: delete
        - target:
            kind: Job
            name: approve-openstack-installplan
          patch: |-
            [
              {"op": "replace", "path": "/metadata/namespace", "value": "openshift-gitops"},
              {"op": "replace", "path": "/spec/template/spec/serviceAccountName", "value": "openshift-gitops-argocd-application-controller"}
            ]
        - target:
            kind: ClusterRoleBinding
            name: installplan-approver-binding
          patch: |-
            [
              {"op": "replace", "path": "/subjects/0/name", "value": "openshift-gitops-argocd-application-controller"},
              {"op": "replace", "path": "/subjects/0/namespace", "value": "openshift-gitops"}
            ]
  openstack-secrets:
    enabled: false
